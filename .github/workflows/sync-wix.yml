name: Sincronizar com o site no Wix
on:
  schedule:
    - cron: "40 */3 * * *"
  workflow_dispatch:
  push:
    paths:
      - "tools/**"
      - ".github/workflows/**"
permissions:
  contents: write
concurrency:
  group: sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Baixar a versão atual do site
        run: |
          BASE="https://headless-crgvvnpdjbk-renanmartinscor-140f.wix-site-host.com"
          for f in index.html guia-itapoa.html monograma.svg monograma-escuro.svg; do
            curl -fsSL "$BASE/$f" -o "/tmp/$f.new" || continue
            if [ "$(wc -c < /tmp/$f.new)" -gt 500 ] && grep -qi "</html>\|</svg>" "/tmp/$f.new"; then
              mv "/tmp/$f.new" "$f"
            fi
          done
      - name: Copiar imóveis à venda da Cleverson (1x por dia)
        run: |
          npm install --prefix /tmp/n sharp@0.33.5 --no-audit --no-fund --silent
          NODE_PATH=/tmp/n/node_modules node tools/cleverson.js || echo "Catálogo Cleverson não atualizado nesta rodada"
      - name: Gerar páginas para o Google
        run: node tools/gerar-paginas.js
      - name: Publicar se mudou
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Atualização automática do site"
            git pull --rebase -q || true
            git push
          fi
